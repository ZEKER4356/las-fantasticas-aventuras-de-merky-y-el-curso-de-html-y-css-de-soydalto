<!DOCTYPE html>
<html>
    <head>
        <title>Formulario para besar a Tahir</title>
    </head>
    <body>
        <h1>Bienvenido al formulario para darle ricos besos a Tahir</h1>
        <p>Ingresa tus datos y envia tu solicitud para besarlo</p>
        <form>
            <p>Datos para la solicitud</p>
            <input type="text" placeholder="Tu nombre" required name="name" minlength="3">
            <input type="email" placeholder="Tu correo electrónico" required name="email">
            <input type="number" placeholder="Tu numero de telefono" required name="phone">
            <p>Porque quieres besar a Tahir?</p>
            <input type="text" placeholder="Quiero besarlo por..." required name="porque_besarlo">
            <p>Aceptas que te bese y todo lo que pueda pasar despues?</p>
            <input type="checkbox" required name="terminosCondiciones">
            <input type="submit" value="Enviar solicitud">
        </form>
    </body>
</html>
